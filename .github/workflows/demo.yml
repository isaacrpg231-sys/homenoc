# Publica a interface no GitHub Pages. Fora do computador ela abre sozinha no
# modo demonstração (rede simulada), então qualquer pessoa pode experimentar.
# Uma vez só: Settings > Pages > Source: "GitHub Actions".
name: Demonstração online

on:
  push:
    branches: [main]
    paths: ["homenoc/web/**", ".github/workflows/demo.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: homenoc/web
      - id: deploy
        uses: actions/deploy-pages@v4
