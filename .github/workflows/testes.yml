name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: Python ${{ matrix.python }} no ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Estilo (ruff)
        run: |
          python -m pip install --quiet ruff
          ruff check homenoc tests
      - name: Testes automatizados
        run: python -m unittest discover -s tests -v
        env:
          PYTHONIOENCODING: utf-8
      - name: Sintaxe da interface (JavaScript)
        if: runner.os == 'Linux'
        run: for f in homenoc/web/*.js; do node --check "$f"; done
