zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 2d8c9a54d383473b9894fe14f9c04940
      name: Templates/Casa
  templates:
    - uuid: 0e7274e5a6b6499f88c0aed6cacb1201
      template: 'Casa - Internet'
      name: 'Casa - Internet'
      description: |
        Verifica a conexão com a internet pingando dois servidores externos.
        A internet só é considerada FORA DO AR se nenhum dos dois responder
        nas últimas 3 verificações (evita alarme falso por um pacote perdido).
        Para trocar os servidores, altere as macros {$INTERNET.DNS1} e {$INTERNET.DNS2}.
      groups:
        - name: Templates/Casa
      items:
        - uuid: e71e2df595a542cf9b8158de797e2daa
          name: 'Ping DNS 1 ({$INTERNET.DNS1})'
          type: SIMPLE
          key: 'icmpping[{$INTERNET.DNS1}]'
          description: '1 = respondeu, 0 = sem resposta (3 pacotes por verificação).'
          valuemap:
            name: 'Estado do ping'
          tags:
            - tag: component
              value: internet
        - uuid: b408c6ee78d84fb0ace306afac635344
          name: 'Ping DNS 2 ({$INTERNET.DNS2})'
          type: SIMPLE
          key: 'icmpping[{$INTERNET.DNS2}]'
          description: '1 = respondeu, 0 = sem resposta (3 pacotes por verificação).'
          valuemap:
            name: 'Estado do ping'
          tags:
            - tag: component
              value: internet
        - uuid: fbc29a4c764b4fbb8418b3bfaafadfb5
          name: 'Latência DNS 1 ({$INTERNET.DNS1})'
          type: SIMPLE
          key: 'icmppingsec[{$INTERNET.DNS1}]'
          value_type: FLOAT
          units: s
          description: 'Tempo médio de resposta do ping.'
          tags:
            - tag: component
              value: internet
        - uuid: 9c54043a075a4404b5a037c97bc55936
          name: 'Latência DNS 2 ({$INTERNET.DNS2})'
          type: SIMPLE
          key: 'icmppingsec[{$INTERNET.DNS2}]'
          value_type: FLOAT
          units: s
          description: 'Tempo médio de resposta do ping.'
          tags:
            - tag: component
              value: internet
      macros:
        - macro: '{$INTERNET.DNS1}'
          value: 8.8.8.8
          description: 'Servidor externo nº 1 (Google DNS).'
        - macro: '{$INTERNET.DNS2}'
          value: 1.1.1.1
          description: 'Servidor externo nº 2 (Cloudflare DNS).'
      valuemaps:
        - uuid: 5be62bc863cc4a25b5cf9f0a0df8f695
          name: 'Estado do ping'
          mappings:
            - value: '0'
              newvalue: 'Sem resposta'
            - value: '1'
              newvalue: Respondeu
    - uuid: a4d504dba2a54a6cbb72a3395d04168d
      template: 'Casa - Trafego UPnP'
      name: 'Casa - Tráfego UPnP'
      description: |
        Tráfego da internet da casa toda (download e upload), lido do roteador via UPnP
        pelo script upnp_wan.py (verificação externa).
        Antes de usar, confirme que o roteador suporta:  python3 upnp_wan.py --testar
      groups:
        - name: Templates/Casa
      items:
        - uuid: 74fe863ca6b749fdb61aeb4473c50d40
          name: 'Internet: download'
          type: EXTERNAL
          key: 'upnp_wan.py[recebidos]'
          delay: 30s
          timeout: 10s
          units: bps
          description: 'Velocidade de download da casa toda, calculada pelo contador de bytes recebidos da porta WAN do roteador.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: component
              value: trafego
        - uuid: 0f1c0dd11a5747339fcd642727a9284d
          name: 'Internet: upload'
          type: EXTERNAL
          key: 'upnp_wan.py[enviados]'
          delay: 30s
          timeout: 10s
          units: bps
          description: 'Velocidade de upload da casa toda, calculada pelo contador de bytes enviados da porta WAN do roteador.'
          preprocessing:
            - type: CHANGE_PER_SECOND
              parameters:
                - ''
            - type: MULTIPLIER
              parameters:
                - '8'
          tags:
            - tag: component
              value: trafego
  triggers:
    - uuid: 4507e9950801407fb0bf0d5b5baed703
      expression: 'max(/Casa - Internet/icmpping[{$INTERNET.DNS1}],#3)=0 and max(/Casa - Internet/icmpping[{$INTERNET.DNS2}],#3)=0'
      name: 'Internet fora do ar'
      priority: HIGH
      description: 'Nenhum dos dois servidores externos respondeu nas últimas 3 verificações.'
      tags:
        - tag: scope
          value: availability
  graphs:
    - uuid: c1618dd77dcb4d6e91bb9cd09b62eab3
      name: 'Latência da internet'
      graph_items:
        - color: 1E88E5
          item:
            host: 'Casa - Internet'
            key: 'icmppingsec[{$INTERNET.DNS1}]'
        - sortorder: '1'
          color: F4511E
          item:
            host: 'Casa - Internet'
            key: 'icmppingsec[{$INTERNET.DNS2}]'
    - uuid: e3ba204eabe04d29a87d2d71ff69f0c8
      name: 'Tráfego da internet'
      graph_items:
        - drawtype: GRADIENT_LINE
          color: 199C0D
          item:
            host: 'Casa - Trafego UPnP'
            key: 'upnp_wan.py[recebidos]'
        - sortorder: '1'
          drawtype: BOLD_LINE
          color: F63100
          item:
            host: 'Casa - Trafego UPnP'
            key: 'upnp_wan.py[enviados]'
